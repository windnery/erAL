<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>erAL</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="main_menu">
        <h1 id="menu_title">erAL</h1>
        <div id="menu_options">
            <span id="new_game_btn" class="menu-option">初入港区</span>
            <span id="continue_game_btn" class="menu-option">继续经营</span>
        </div>
    </div>

    <!-- 共享状态条（游戏界面显示，主菜单与全屏幕隐藏） -->
    <div id="status_bar" style="display: none;">
        <span id="day"></span>
        <span id="time"></span>
        <span id="period"></span>
        <span style="margin: 0px 10px;">当前位置: <span id="loc"></span></span>
        <span id="money"></span>
        <br>
        <span id="player_state"></span>
        <span> 体力 </span>
        <div class="bar-track"><div class="bar-fill" id="stamina_fill"></div></div>
        <span id="stamina_text"></span>
        <span> 气力 </span>
        <div class="bar-track"><div class="bar-fill" id="energy_fill"></div></div>
        <span id="energy_text"></span>
        <span> 精力 </span>
        <div class="bar-track"><div class="bar-fill" id="vitality_fill"></div></div>
        <span id="vitality_text"></span>
    </div>

    <!-- 缓冲菜单界面（每日开始） -->
    <div id="menu_screen" style="display: none;">
        <div id="MENU_COM"></div>
    </div>

    <div id="game_screen" style="display: none;">

        <!-- 角色信息区 -->
        <div id="charaPanel"></div>

        <!-- 角色立绘区（头像排 + 点击选中） -->
        <div id="charaPortrait"></div>

        <!-- 交互指令区 -->
        <div id="Act_COM"></div>

        <!-- 通用指令区 -->
        <div id="Ex_COM"></div>

        <!-- 调教指令区（训练态显示） -->
        <div id="TRAIN_COM" style="display: none;"></div>

        <!-- 调教目标区（训练态显示） -->
        <div id="train_members" style="display: none;"></div>

    </div>

    <!-- 全屏文字区 -->
    <div id="fullscreen_text"></div>

    <!-- 全屏选择幕 -->
    <div id="fullscreen_options"></div>

    <!-- 全屏立绘 -->
    <div id="fullscreen_portrait"></div>

    <!-- 全屏角色信息面板 -->
    <div id="fullscreen_charinfo"></div>

    <!-- 皮肤商店（明石商店） -->
    <div id="skin_shop_screen"></div>

    <!-- 皮肤立绘展示 -->
    <div id="skin_shop_portrait"></div>

    <!-- 道具商店（不知火商店） -->
    <div id="daily_shop_screen"></div>

    <!-- 道具背包（系统指令「道具」） -->
    <div id="inventory_screen"></div>

    <script type="module" src="js/main.js"></script>
    
</body>

</html>
