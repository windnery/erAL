<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>erAL</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="main_menu">
        <h1>erAL</h1>
        <button id="new_game_btn">初入港区</button>
        <button id="continue_game_btn">继续经营</button>
    </div>

    <div id="game_screen" style="display: none;">
        <!-- 状态区 -->
        <div id="status_bar">
            <!-- 时间信息 -->
            <span id="day"></span>
            <span id="time"></span>
            <span id="period"></span>

            <!-- 位置信息 -->
            <span style="margin: 0px 10px;">当前位置: <span id="loc"></span></span>

            <!-- 资金信息 -->
            <span id="money"></span>
            <br>
            <!-- 玩家状态条 -->
            <span id="player_state"></span>
            <span> 体力 </span>
            <div class="bar-track"><div class="bar-fill" id="stamina_fill"></div></div>
            <span id="stamina_text"></span>
            <span> 气力 </span>
            <div class="bar-track"><div class="bar-fill" id="energy_fill"></div></div>
            <span id="energy_text"></span>
        </div>

        <!-- 角色信息区 -->
        <div id="charaPanel"></div>

        <!-- 角色立绘区（头像排 + 点击选中） -->
        <div id="charaPortrait"></div>

        <!-- 交互指令区 -->
        <div id="Act_COM"></div>

        <!-- 通用指令区 -->
        <div id="Ex_COM"></div>

        <hr>

    </div>

    <!-- 全屏文字区 -->
    <div id="fullscreen_text"></div>

    <!-- 全屏选择幕 -->
    <div id="fullscreen_options"></div>

    <!-- 全屏立绘 -->
    <div id="fullscreen_portrait"></div>

    <script type="module" src="js/main.js"></script>
    
</body>

</html>
