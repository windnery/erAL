<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立绘头像可视化微调工具 - erAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0c0f14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左侧侧边栏：角色与皮肤列表 */
        #sidebar {
            width: 320px;
            background: #141820;
            border-right: 1px solid #232936;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #232936;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: bold;
            color: #4e88ff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            background: #090c10;
            border: 1px solid #283344;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #4e88ff;
        }

        .character-select-row {
            padding: 10px 16px;
            border-bottom: 1px solid #1c222d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .char-select {
            flex: 1;
            padding: 6px 10px;
            background: #1a2230;
            border: 1px solid #33445e;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .skin-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skin-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: #1a202c;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .skin-item:hover {
            background: #232d3f;
            border-color: #3b4d6b;
        }

        .skin-item.active {
            background: #1b335a;
            border-color: #4e88ff;
        }

        .skin-thumb {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            flex-shrink: 0;
        }

        .skin-info {
            flex: 1;
            min-width: 0;
        }

        .skin-name {
            font-size: 13px;
            color: #e0e8f5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .skin-status {
            font-size: 11px;
            color: #70c070;
            margin-top: 2px;
        }

        .skin-status.missing {
            color: #ffaa44;
        }

        /* 中间主工作区：画布与裁剪器 */
        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #080a0e;
            position: relative;
            overflow: hidden;
        }

        .toolbar {
            height: 48px;
            background: #121620;
            border-bottom: 1px solid #232936;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .toolbar-info {
            font-size: 14px;
            color: #a0aec0;
        }

        .toolbar-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-default {
            background: #1e2636;
            border-color: #313f56;
            color: #cbd5e1;
        }

        .btn-default:hover {
            background: #2b374d;
            color: #fff;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #16a34a;
            color: #fff;
            font-weight: bold;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(45deg, #0e1117 25%, transparent 25%), 
                linear-gradient(-45deg, #0e1117 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #0e1117 75%), 
                linear-gradient(-45deg, transparent 75%, #0e1117 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        #image_wrapper {
            position: relative;
            display: inline-block;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        #main_image {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 100px);
            user-drag: none;
            -webkit-user-drag: none;
        }

        /* 交互选框 */
        #crop_box {
            position: absolute;
            border: 2px solid #ffff00;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65), 0 0 10px rgba(255, 255, 0, 0.5);
            cursor: move;
            display: none;
            touch-action: none;
        }

        #crop_box::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        .crop-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffff00;
            border: 1px solid #000;
        }

        .handle-nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .handle-ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .handle-sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .handle-se { bottom: -6px; right: -6px; cursor: nwse-resize; }

        /* 右侧面板：实时头像预览 */
        #preview_panel {
            width: 260px;
            background: #141820;
            border-left: 1px solid #232936;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 20px;
            flex-shrink: 0;
        }

        .preview-title {
            font-size: 15px;
            font-weight: bold;
            color: #93c5fd;
            align-self: flex-start;
        }

        .preview-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .preview-label {
            font-size: 12px;
            color: #8899aa;
        }

        .preview-box-116 {
            width: 116px;
            height: 116px;
            border: 2px solid #3b82f6;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-box-round {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #10b981;
            background: #000;
            overflow: hidden;
        }

        #preview_canvas {
            width: 116px;
            height: 116px;
            display: block;
        }

        .preview-info-card {
            width: 100%;
            background: #0c1017;
            border: 1px solid #222d3d;
            border-radius: 6px;
            padding: 12px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .shortcut-tips {
            font-size: 11px;
            color: #64748b;
            line-height: 1.6;
            width: 100%;
            border-top: 1px solid #222d3d;
            padding-top: 12px;
        }

        .shortcut-key {
            display: inline-block;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 11px;
            margin: 0 2px;
        }

        /* Toast 提示 */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 101, 52, 0.95);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- 左侧列表 -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span>🎨 立绘头像微调</span>
            </div>
            <input type="text" id="search_input" class="search-input" placeholder="搜索角色名或皮肤..." />
        </div>
        <div class="character-select-row">
            <span style="font-size: 13px; color: #8899aa;">角色:</span>
            <select id="char_select" class="char-select"></select>
        </div>
        <div id="skin_list" class="skin-list"></div>
    </div>

    <!-- 中间工作区 -->
    <div id="workspace">
        <div class="toolbar">
            <div class="toolbar-info">
                当前: <strong id="cur_char_name" style="color: #fff;">-</strong> / <span id="cur_skin_name">-</span>
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-default" id="prev_btn">⬅ 上一张 (A)</button>
                <button class="btn btn-default" id="next_btn">下一张 (D) ➡</button>
                <button class="btn btn-success" id="save_btn">💾 保存头像 (Space / Ctrl+S)</button>
            </div>
        </div>

        <div class="canvas-container" id="canvas_container">
            <div id="image_wrapper">
                <img id="main_image" src="" alt="立绘" />
                <div id="crop_box">
                    <div class="crop-handle handle-nw" data-handle="nw"></div>
                    <div class="crop-handle handle-ne" data-handle="ne"></div>
                    <div class="crop-handle handle-sw" data-handle="sw"></div>
                    <div class="crop-handle handle-se" data-handle="se"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧预览 -->
    <div id="preview_panel">
        <div class="preview-title">实时 116×116 效果</div>

        <div class="preview-group">
            <div class="preview-label">游戏内实际头像 (116x116)</div>
            <div class="preview-box-116">
                <canvas id="preview_canvas" width="116" height="116"></canvas>
            </div>
        </div>

        <div class="preview-info-card">
            <div>原始分辨率: <strong id="orig_res" style="color:#fff;">0 x 0</strong></div>
            <div>选框坐标: X:<span id="crop_x">0</span> Y:<span id="crop_y">0</span></div>
            <div>取景尺寸: <span id="crop_size">0</span> px</div>
        </div>

        <button class="btn btn-success" style="width: 100%; justify-content: center; padding: 10px;" id="save_btn_side">
            💾 保存并进入下一张
        </button>

        <div class="shortcut-tips">
            <div>💡 <strong>快捷操作技巧:</strong></div>
            <div>• 鼠标滚轮: <strong>快速缩放头像框</strong></div>
            <div>• 拖拽红框: <strong>移动取景位置</strong></div>
            <div>• <span class="shortcut-key">空格</span> 或 <span class="shortcut-key">Ctrl+S</span>: 保存头像</div>
            <div>• <span class="shortcut-key">A</span> / <span class="shortcut-key">D</span>: 上一张 / 下一张</div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let allData = [];
        let curCharIdx = 0;
        let curSkinIdx = 0;
        let curImageObj = null;

        // 真实图片尺寸与显示尺寸缩放比
        let naturalW = 0, naturalH = 0;
        let displayScale = 1.0;

        // 裁切框数据（相对原图像素）
        let crop = { x: 0, y: 0, size: 200 };

        const mainImage = document.getElementById('main_image');
        const cropBox = document.getElementById('crop_box');
        const imageWrapper = document.getElementById('image_wrapper');
        const previewCanvas = document.getElementById('preview_canvas');
        const ctx = previewCanvas.getContext('2d');

        // 加载所有立绘数据
        async function init() {
            try {
                const res = await fetch('/api/skins');
                allData = await res.json();
                populateCharSelect();
                loadCharacter(0);
            } catch (err) {
                alert('获取立绘数据失败，请确保 python tools/run_editor.py 正在运行！');
            }
        }

        function populateCharSelect() {
            const select = document.getElementById('char_select');
            select.innerHTML = '';
            allData.forEach((c, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${c.character} (${c.skins.length})`;
                select.appendChild(opt);
            });
            select.onchange = (e) => {
                curCharIdx = parseInt(e.target.value);
                loadCharacter(curCharIdx);
            };
        }

        function loadCharacter(charIdx) {
            curCharIdx = charIdx;
            document.getElementById('char_select').value = charIdx;
            const charData = allData[charIdx];
            renderSkinList(charData.skins);
            loadSkin(0);
        }

        function renderSkinList(skins) {
            const list = document.getElementById('skin_list');
            list.innerHTML = '';
            skins.forEach((skin, idx) => {
                const item = document.createElement('div');
                item.className = 'skin-item' + (idx === curSkinIdx ? ' active' : '');
                item.onclick = () => loadSkin(idx);

                const img = document.createElement('img');
                img.className = 'skin-thumb';
                img.src = skin.avatar_url || skin.portrait_url;

                const info = document.createElement('div');
                info.className = 'skin-info';

                const name = document.createElement('div');
                name.className = 'skin-name';
                name.textContent = skin.basename;

                const status = document.createElement('div');
                status.className = 'skin-status' + (skin.has_avatar ? '' : ' missing');
                status.textContent = skin.has_avatar ? '✓ 已有头像' : '● 待生成';

                info.appendChild(name);
                info.appendChild(status);
                item.appendChild(img);
                item.appendChild(info);
                list.appendChild(item);
            });
        }

        function loadSkin(skinIdx) {
            curSkinIdx = skinIdx;
            const charData = allData[curCharIdx];
            const skin = charData.skins[skinIdx];

            document.getElementById('cur_char_name').textContent = charData.character;
            document.getElementById('cur_skin_name').textContent = skin.basename;

            // 更新侧边栏高亮
            document.querySelectorAll('.skin-item').forEach((el, idx) => {
                el.classList.toggle('active', idx === skinIdx);
            });

            curImageObj = new Image();
            curImageObj.src = skin.portrait_url;
            curImageObj.onload = () => {
                naturalW = curImageObj.naturalWidth;
                naturalH = curImageObj.naturalHeight;
                mainImage.src = skin.portrait_url;

                document.getElementById('orig_res').textContent = `${naturalW} x ${naturalH}`;

                // 初始默认框：位于上方 15%~35% 水平居中
                const initialSize = Math.min(naturalW, naturalH) * 0.35;
                crop.size = Math.max(100, Math.round(initialSize));
                crop.x = Math.round((naturalW - crop.size) / 2);
                crop.y = Math.round(naturalH * 0.15);

                cropBox.style.display = 'block';
                updateDisplay();
            };
        }

        function updateDisplay() {
            if (!mainImage.clientWidth) return;
            displayScale = mainImage.clientWidth / naturalW;

            // 限制 crop 坐标不出界
            crop.size = Math.min(crop.size, Math.min(naturalW, naturalH));
            crop.size = Math.max(crop.size, 40);
            crop.x = Math.max(0, Math.min(naturalW - crop.size, crop.x));
            crop.y = Math.max(0, Math.min(naturalH - crop.size, crop.y));

            // 更新 DOM 选框位置与大小
            cropBox.style.left = `${crop.x * displayScale}px`;
            cropBox.style.top = `${crop.y * displayScale}px`;
            cropBox.style.width = `${crop.size * displayScale}px`;
            cropBox.style.height = `${crop.size * displayScale}px`;

            document.getElementById('crop_x').textContent = Math.round(crop.x);
            document.getElementById('crop_y').textContent = Math.round(crop.y);
            document.getElementById('crop_size').textContent = Math.round(crop.size);

            // 绘制 116x116 实时预览
            ctx.clearRect(0, 0, 116, 116);
            ctx.drawImage(
                curImageObj,
                crop.x, crop.y, crop.size, crop.size,
                0, 0, 116, 116
            );
        }

        window.addEventListener('resize', updateDisplay);

        // 交互：拖拽移动与拉伸
        let isDragging = false;
        let isResizing = false;
        let activeHandle = null;
        let startX = 0, startY = 0;
        let startCrop = { x: 0, y: 0, size: 0 };

        cropBox.addEventListener('mousedown', (e) => {
            if (e.target.dataset.handle) {
                isResizing = true;
                activeHandle = e.target.dataset.handle;
            } else {
                isDragging = true;
            }
            startX = e.clientX;
            startY = e.clientY;
            startCrop = { ...crop };
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging && !isResizing) return;
            const dx = (e.clientX - startX) / displayScale;
            const dy = (e.clientY - startY) / displayScale;

            if (isDragging) {
                crop.x = startCrop.x + dx;
                crop.y = startCrop.y + dy;
            } else if (isResizing) {
                if (activeHandle === 'se') {
                    const delta = Math.max(dx, dy);
                    crop.size = Math.max(40, startCrop.size + delta);
                } else if (activeHandle === 'sw') {
                    const delta = Math.max(-dx, dy);
                    crop.size = Math.max(40, startCrop.size + delta);
                    crop.x = startCrop.x + (startCrop.size - crop.size);
                } else if (activeHandle === 'nw') {
                    const delta = Math.max(-dx, -dy);
                    crop.size = Math.max(40, startCrop.size + delta);
                    crop.x = startCrop.x + (startCrop.size - crop.size);
                    crop.y = startCrop.y + (startCrop.size - crop.size);
                } else if (activeHandle === 'ne') {
                    const delta = Math.max(dx, -dy);
                    crop.size = Math.max(40, startCrop.size + delta);
                    crop.y = startCrop.y + (startCrop.size - crop.size);
                }
            }
            updateDisplay();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
        });

        // 滚轮缩放头像框
        imageWrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 25 : -25;
            const newSize = Math.max(50, Math.min(Math.min(naturalW, naturalH), crop.size + delta));
            const diff = newSize - crop.size;
            // 以选框中心为基准等比缩放
            crop.x -= diff / 2;
            crop.y -= diff / 2;
            crop.size = newSize;
            updateDisplay();
        }, { passive: false });

        // 保存头像
        async function saveAvatar() {
            const charData = allData[curCharIdx];
            const skin = charData.skins[curSkinIdx];

            try {
                const res = await fetch('/api/save_avatar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        character: charData.character,
                        basename: skin.basename,
                        crop_box: [Math.round(crop.x), Math.round(crop.y), Math.round(crop.size)]
                    })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    skin.has_avatar = true;
                    skin.avatar_url = result.avatar_url;
                    renderSkinList(charData.skins);
                    showToast(`✓ 已成功保存: ${charData.character}/${skin.basename}.webp`);
                }
            } catch (err) {
                alert('保存失败: ' + err);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 2000);
        }

        // 翻页
        function prevSkin() {
            const charData = allData[curCharIdx];
            if (curSkinIdx > 0) {
                loadSkin(curSkinIdx - 1);
            } else if (curCharIdx > 0) {
                curCharIdx--;
                loadCharacter(curCharIdx);
                loadSkin(allData[curCharIdx].skins.length - 1);
            }
        }

        function nextSkin() {
            const charData = allData[curCharIdx];
            if (curSkinIdx < charData.skins.length - 1) {
                loadSkin(curSkinIdx + 1);
            } else if (curCharIdx < allData.length - 1) {
                curCharIdx++;
                loadCharacter(curCharIdx);
                loadSkin(0);
            }
        }

        // 按钮与快捷键绑定
        document.getElementById('prev_btn').onclick = prevSkin;
        document.getElementById('next_btn').onclick = nextSkin;
        document.getElementById('save_btn').onclick = saveAvatar;
        document.getElementById('save_btn_side').onclick = async () => {
            await saveAvatar();
            nextSkin();
        };

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (e.code === 'Space' || (e.ctrlKey && e.code === 'KeyS')) {
                e.preventDefault();
                saveAvatar();
            } else if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
                prevSkin();
            } else if (e.code === 'KeyD' || e.code === 'ArrowRight') {
                nextSkin();
            }
        });

        init();
    </script>
</body>
</html>
